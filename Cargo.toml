[package]
name = "news_letter"
authors = ["Millen Mark Aquino"]
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "news_letter"
path = "src/main.rs"

[dependencies]
actix-web = "4.15.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
config = "0.15.25"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "macros", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.1", features = ["v4"] }
